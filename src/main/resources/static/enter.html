<!-- enter.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>퀴즈 방 입장</title>
  <style>
    body { font-family: sans-serif; padding: 50px; text-align: center; }
    input { padding: 10px; margin: 10px; width: 200px; }
    button { padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>🚪 퀴즈 방 입장</h2>
  <input id="room" placeholder="방 코드 입력" /><br />
  <input id="user" placeholder="닉네임 입력" /><br />
  <button onclick="enterRoom()">입장하기</button>

  <script>
    function enterRoom() {
      const room = document.getElementById("room").value.trim();
      const user = document.getElementById("user").value.trim();
      if (!room || !user) {
        alert("방 코드와 닉네임을 모두 입력해주세요.");
        return;
      }
      window.location.href = `chat.html?room=${room}&user=${user}`;
    }
  </script>
</body>
</html>
