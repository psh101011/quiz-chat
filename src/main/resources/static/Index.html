<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>채팅 기반 텍스트 퀴즈</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #chat { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    .msg { margin-bottom: 5px; }
    .user { color: blue; font-weight: bold; }
    .server { color: green; font-weight: bold; }
    input { padding: 5px; }
  </style>
</head>
<body>
  <h2>💬 텍스트 퀴즈 채팅방</h2>

  <div id="question"><strong>문제:</strong> 로딩 중...</div>

  <div id="chat"></div>

  <input id="user" placeholder="닉네임" />
  <input id="answer" placeholder="정답 입력" />
  <button onclick="sendAnswer()">전송</button>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
  <script>
    const socket = new SockJS("/quiz-ws");
    const stompClient = Stomp.over(socket);

    const questions = [
      { question: "1️⃣ 사과를 영어로 하면?", answer: "apple" },
      { question: "2️⃣ 바나나를 영어로 하면?", answer: "banana" },
      { question: "3️⃣ 고양이를 영어로 하면?", answer: "cat" }
    ];

    let currentIndex = 0;

    function showQuestion() {
      document.getElementById("question").innerHTML = `<strong>문제:</strong> ${questions[currentIndex].question}`;
    }

    function addMessage(text, type = 'server') {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    stompClient.connect({}, () => {
      console.log("✅ 연결됨");
      showQuestion();

      stompClient.subscribe("/topic/chat", msg => {
        addMessage("💬 " + msg.body, 'user'); // 상대 유저 채팅
      });

      stompClient.subscribe("/topic/correct", msg => {
        addMessage("✔️ " + msg.body, 'server');
      });

      stompClient.subscribe("/topic/next", msg => {
        currentIndex++;
        if (currentIndex < questions.length) {
          showQuestion();
        } else {
          addMessage("🏁 모든 문제가 끝났습니다!", 'server');
        }
      });
    });

    function sendAnswer() {
      const user = document.getElementById("user").value.trim();
      const answer = document.getElementById("answer").value.trim();
      if (!user || !answer) return;

      // 내 입력도 채팅창에 출력
      //addMessage(`🙋 ${user}: ${answer}`, 'user');

      // 서버로 정답 전송
      stompClient.send("/app/answer", {}, JSON.stringify({
        user,
        answer
      }));

      document.getElementById("answer").value = "";
    }
  </script>
</body>
</html>
